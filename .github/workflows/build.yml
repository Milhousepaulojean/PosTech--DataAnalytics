name: Build

# Build completo disparado em pushes para Development e main.
# Executa testes em matriz de versões Python, executa notebooks com papermill
# e armazena artefatos de build.

on:
  push:
    branches:
      - main
      - Development

# Cancela execuções antigas do mesmo branch ao receber novo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas — somente leitura do código.
# Artefatos são publicados pelo runner sem permissão adicional.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Testes automatizados com matriz de versões Python (~3-5 min por slot)
  # ---------------------------------------------------------------------------
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matriz cobre versões mínima e máximas suportadas do projeto
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false  # continua testando outras versões mesmo se uma falhar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt

      # Executa pytest somente se existirem arquivos de teste.
      # Exit code 5 do pytest (no tests collected) é tratado via verificação prévia.
      - name: Run pytest
        run: |
          test_files=$(find . \( -name "test_*.py" -o -name "*_test.py" \) \
            ! -path "*/.git/*" ! -path "*/.venv/*" ! -path "*/venv/*" ! -path "*/build/*")
          if [ -n "$test_files" ]; then
            pytest --tb=short -v \
              --cov=. \
              --cov-report=xml \
              --cov-report=term-missing \
              --cov-config=pyproject.toml
          else
            echo "::notice::No test files found — skipping pytest"
            echo "Add test files named test_*.py or *_test.py to enable automated testing."
          fi

      # Faz upload do coverage.xml apenas se foi gerado (silencioso se não houver)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JOB 2: Execução dos notebooks via papermill (~variável, pode ser longo)
  # Roda em paralelo com o job de testes para feedback mais rápido.
  # ---------------------------------------------------------------------------
  notebooks:
    name: Execute Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements-dev.txt

      # Registra o kernel Python3 para papermill encontrar
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      # Executa cópias dos notebooks em build/notebooks/ — originais intocados.
      # papermill salva a saída de execução no arquivo de destino, nunca na fonte.
      # Timeout por célula: 300s (5 min). Ajuste por notebook se necessário.
      - name: Execute notebooks with papermill
        run: |
          failed=0
          count=0

          mkdir -p build/notebooks

          # Lê nomes de arquivo com -print0 para suportar espaços e caracteres especiais
          while IFS= read -r -d '' nb; do
            count=$((count + 1))
            rel="${nb#./}"
            # Substitui '/' por '__' no nome do arquivo de saída
            out_name="${rel//\//__}"
            out="build/notebooks/${out_name}"

            echo "::group::Executing: $rel"
            nb_dir="$(dirname "$nb")"
            if papermill "$nb" "$out" \
                --execution-timeout 300 \
                --kernel python3 \
                --no-progress-bar \
                --cwd "$nb_dir" 2>&1; then
              echo "✓ Success: $rel"
            else
              echo "::error file=$rel::Notebook execution failed — check cell output above"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find . -name "*.ipynb" \
              ! -path "*/.ipynb_checkpoints/*" \
              ! -path "*/build/*" \
              ! -path "*/.git/*" \
              -print0)

          if [ "$count" -eq 0 ]; then
            echo "::notice::No notebooks found — skipping execution"
            exit 0
          fi

          echo "Processed $count notebook(s). Failed: $failed."
          exit $failed

      # Armazena notebooks executados como artefatos (com outputs das células)
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-${{ github.sha }}
          path: build/notebooks/
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JOB 3: Resumo do build — agrega resultados e define status final
  # ---------------------------------------------------------------------------
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, notebooks]
    if: always()

    steps:
      - name: Write job summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          NB_RESULT: ${{ needs.notebooks.result }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Build Summary — \`${BRANCH}\`"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Tests (Python 3.10 / 3.11 / 3.12) | \`${TEST_RESULT}\` |"
            echo "| Notebook execution | \`${NB_RESULT}\` |"
            echo ""
            echo "**Commit:** \`${SHA:0:7}\`  |  **Branch:** \`${BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_RESULT" = "failure" ] || [ "$NB_RESULT" = "failure" ]; then
            echo "::error::Build failed — see job logs above for details"
            exit 1
          fi
